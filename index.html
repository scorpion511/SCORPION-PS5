<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Scorpion Hack All In 1</title>
  <style>
    /* ── tokens ─────────────────────────────────────────── */
    :root {
      --bg:      #07090f;
      --surface: #0c1019;
      --border:  #182030;
      --text:    #d6e4ff;
      --muted:   #8aa0c4;
      --accent:  #00d4ec; /* Custom Scorpion Neon Cyan Accent */
      --ok:      #00d48c;
      --bad:     #ff3b52;
      color-scheme: dark;
    }

    /* ── reset ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: url('./logo.jpg') no-cache center center fixed;
      background-size: cover;
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      display: flex;
      justify-content: center;
      padding: 28px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    }

    /* ── layout ──────────────────────────────────────────── */
    .wrap {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    /* ── header layout ───────────────────────────────────── */
    .scorp-hdr {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    .scorp-meta-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 650px;
      color: var(--accent);
      font-size: 14px;
      letter-spacing: 0.1em;
    }

    .psh-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 0 15px var(--accent);
    }

    .main-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent);
    }

    .sub-title {
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.08em;
      margin-top: -5px;
    }

    /* ── menu layout buttons ────────────────────────────── */
    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 500px;
      margin-top: 10px;
    }

    .menu-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .scorp-btn {
      flex: 1;
      background: rgba(12, 16, 25, 0.75);
      border: 2px solid var(--accent);
      border-radius: 8px;
      color: #fff;
      padding: 12px 10px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: inset 0 0 8px rgba(0, 212, 236, 0.2);
      transition: all 0.2s ease;
    }

    .scorp-btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 15px var(--accent);
    }

    /* ── exploit stages ──────────────────────────────────── */
    .stages {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 500px;
    }

    .stage {
      flex: 1;
      background: rgba(12, 16, 25, 0.8);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 4px;
      text-align: center;
    }

    .stage-label {
      display: block;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .stage-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--border);
      margin: 0 auto;
    }

    /* internal runtime monitoring hooks */
    .stage[data-s="active"] { border-color: var(--accent); }
    .stage[data-s="active"] .stage-label { color: var(--accent); }
    .stage[data-s="active"] .stage-dot {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .stage[data-s="done"] { border-color: var(--ok); }
    .stage[data-s="done"] .stage-label { color: var(--ok); }
    .stage[data-s="done"] .stage-dot { background: var(--ok); }
    .stage[data-s="error"] { border-color: var(--bad); }
    .stage[data-s="error"] .stage-label { color: var(--bad); }
    .stage[data-s="error"] .stage-dot { background: var(--bad); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    /* ── invisible/hidden core dependencies ───────────────── */
    .hidden-console-layer {
      display: none !important;
    }

    /* ── footer text design ───────────────────────────────── */
    .credits-panel {
      font-size: 11px;
      color: #fff;
      letter-spacing: 0.05em;
      margin-top: 15px;
    }
    .credits-panel span { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Top Scorpion Row Meta Header -->
    <div class="scorp-hdr">
      <div class="scorp-meta-row">
        <span id="live-date">30/9/2026</span>
        <span id="fw-label">Detecting firmware…</span>
      </div>
      
      <!-- Center Branding Image Element -->
      <img src="./psh-logo.png" alt="Scorpion Logo" class="psh-logo">
      
      <h1 class="main-title">WELCOME TO SCORPION HACK ALL IN 1</h1>
      <p class="sub-title">Select an option below to begin</p>
    </div>

    <!-- Main Navigation Interface -->
    <div class="menu-container">
      <div class="menu-row">
        <button class="scorp-btn">PS3 Device</button>
        <button class="scorp-btn">PS4 Device</button>
        <!-- Modified to actively trigger initialization -->
        <button class="scorp-btn" id="ps5-trigger-btn" style="border-color: #fff;">PS5 Device</button>
      </div>
      
      <div class="menu-row">
        <button class="scorp-btn" style="width: 100%;">PS Tools</button>
      </div>

      <div class="menu-row" style="margin-top: 15px;">
        <button class="scorp-btn">PS4 Themes</button>
        <button class="scorp-btn">Pkg-Zone Site</button>
      </div>
    </div>

    <!-- Exploit Stage Trackers Embedded Seamlessly -->
    <div class="stages">
      <div class="stage" id="stage-init">
        <span class="stage-label">Init</span>
        <div class="stage-dot"></div>
      </div>
      <div class="stage" id="stage-webkit">
        <span class="stage-label">WebKit</span>
        <div class="stage-dot"></div>
      </div>
      <div class="stage" id="stage-kernel">
        <span class="stage-label">Kernel</span>
        <div class="stage-dot"></div>
      </div>
      <div class="stage" id="stage-payloads">
        <span class="stage-label">Payloads</span>
        <div class="stage-dot"></div>
      </div>
    </div>

    <!-- Hidden Exploit Log Core Pipeline (Kept for function stability, hidden from UI) -->
    <div class="hidden-console-layer">
      <div id="console"></div>
      <div class="patch-panel-body"></div>
    </div>

    <!-- Customized Footer Section -->
    <div class="credits-panel">
      <p style="color: var(--bad); margin-bottom: 5px;">Ahmed Essam</p>
      <p>Designed and Compiled By <span>Ahmed Essam</span></p>
    </div>

  </div>

  <!-- Background Core Exploit Architecture Script Injections -->
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>

  <!-- Button Interceptor Script Hook -->
  <script>
    document.getElementById('ps5-trigger-btn').addEventListener('click', function() {
      // Safely invokes the internal module jailbreak run command if loaded
      if (window.main && typeof window.main.run === 'function') {
         window.main.run();
      } else {
         // Fallback tracking hook for default script modules
         console.log("Jailbreak process triggered via custom control panel button UI.");
      }
    });
  </script>
</body>
</html>
